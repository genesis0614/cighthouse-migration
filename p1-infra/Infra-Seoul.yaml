AWSTemplateFormatVersion: "2010-09-09"
Description: "Seoul VPC and EC2 setup"

Resources:
  # VPC
  SeoulVPC:
    Type: "AWS::EC2::VPC"
    Properties:
      CidrBlock: "10.1.0.0/16"
      Tags:
        - Key: "Name"
          Value: "seoul-vpc"

  # Internet Gateway   
  SeoulIGW:
    Type: "AWS::EC2::InternetGateway"
    Properties:
      Tags:
        - Key: "Name"
          Value: "seoul-igw"

  SeoulIGWAttachment:
    Type: "AWS::EC2::VPCGatewayAttachment"
    Properties:
      VpcId: !Ref SeoulVPC
      InternetGatewayId: !Ref SeoulIGW

  # Subnets
  SeoulPubSubnet1:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref SeoulVPC
      CidrBlock: "10.1.1.0/24"
      AvailabilityZone: "ap-northeast-2a"
      Tags:
        - Key: "Name"
          Value: "seoul-pub-sn1"

  SeoulPubSubnet2:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref SeoulVPC
      CidrBlock: "10.1.2.0/24"
      AvailabilityZone: "ap-northeast-2c"
      Tags:
        - Key: "Name"
          Value: "seoul-pub-sn2"

  SeoulPriSubnet3:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref SeoulVPC
      CidrBlock: "10.1.3.0/24"
      AvailabilityZone: "ap-northeast-2a"
      Tags:
        - Key: "Name"
          Value: "seoul-pri-sn3"

  SeoulPriSubnet4:
    Type: "AWS::EC2::Subnet"
    Properties:
      VpcId: !Ref SeoulVPC
      CidrBlock: "10.1.4.0/24"
      AvailabilityZone: "ap-northeast-2c"
      Tags:
        - Key: "Name"
          Value: "seoul-pri-sn4"

  # Route Tables
  SeoulPubRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: "Name"
          Value: "seoul-pub-rt12"

  SeoulPubRoute:
    Type: "AWS::EC2::Route"
    Properties:
      RouteTableId: !Ref SeoulPubRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref SeoulIGW

  SeoulPubSubnetAssoc1:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref SeoulPubRouteTable
      SubnetId: !Ref SeoulPubSubnet1

  SeoulPubSubnetAssoc2:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref SeoulPubRouteTable
      SubnetId: !Ref SeoulPubSubnet2

  SeoulPriRouteTable:
    Type: "AWS::EC2::RouteTable"
    Properties:
      VpcId: !Ref SeoulVPC
      Tags:
        - Key: "Name"
          Value: "seoul-pri-rt34"

  SeoulPriRoute:
    Type: "AWS::EC2::Route"
    Properties:
      RouteTableId: !Ref SeoulPriRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      InstanceId: !Ref SeoulNATInstance

  SeoulPriSubnetAssoc3:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref SeoulPriRouteTable
      SubnetId: !Ref SeoulPriSubnet3

  SeoulPriSubnetAssoc4:
    Type: "AWS::EC2::SubnetRouteTableAssociation"
    Properties:
      RouteTableId: !Ref SeoulPriRouteTable
      SubnetId: !Ref SeoulPriSubnet4

  # 키 이름
  KeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: <key name>
      PublicKeyMaterial: <put ur key in here. ex.ssh-rsa AAAA...>

  # NAT Instance
  SeoulNATInstance:
    Type: "AWS::EC2::Instance"
    Properties:
      InstanceType: "t2.micro"
      KeyName: "seoul-key"
      ImageId: "ami-08fe4e7862fb0d4c2"  # Amazon Linux 2 AMI
      SourceDestCheck: false
      Tags:
        - Key: "Name"
          Value: "seoul-nat-instance"
      NetworkInterfaces: 
          - AssociatePublicIpAddress: true
            DeviceIndex: 0
            GroupSet: 
              - !Ref SeoulNATSG
            SubnetId: !Ref SeoulPubSubnet1
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          echo "P@ssw0rd" | passwd --stdin root
          sed -i "s/^#PermitRootLogin yes/PermitRootLogin yes/g" /etc/ssh/sshd_config
          sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
          systemctl restart sshd
          echo "net.ipv4.ip_forward=1" >> /etc/sysctl.conf
          sysctl -p /etc/sysctl.conf
          yum install -y iptables-services
          systemctl start iptables
          systemctl enable iptables
          iptables -F
          iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
          iptables -F -t filter


  # Launch Template
  SeoulWebLaunchTemplate:
    Type: "AWS::EC2::LaunchTemplate"
    Properties:
      LaunchTemplateName: "seoul-web-launch"
      LaunchTemplateData:
        InstanceType: "t2.micro"
        KeyName: "seoul-key"
        ImageId: "ami-08fe4e7862fb0d4c2"  # Amazon Linux 2 AMI
        SecurityGroupIds:
          - !Ref SeoulWebSG
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo "P@ssw0rd" | passwd --stdin root
            sed -i "s/^#PermitRootLogin yes/PermitRootLogin yes/g" /etc/ssh/sshd_config
            sed -i "s/^PasswordAuthentication no/PasswordAuthentication yes/g" /etc/ssh/sshd_config
            systemctl restart sshd
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            sudo rpm -Uvh https://repo.mysql.com/mysql80-community-release-el7.rpm
            sudo yum install -y mysql-server
            sudo systemctl start mysqld
            sudo systemctl enable mysqld
            sudo amazon-linux-extras enable php8.0
            sudo yum clean metadata
            sudo yum install -y php php-cli php-mysqlnd php-common php-fpm php-json php-zip php-gd php-mbstring php-curl php-xml php-bcmath
            cd /var/www/html/
            wget https://raw.githubusercontent.com/NecroSuh/AWS/refs/heads/main/index.html
            wget https://raw.githubusercontent.com/NecroSuh/AWS/refs/heads/main/login.html
            wget https://raw.githubusercontent.com/NecroSuh/AWS/refs/heads/main/login.php
            wget https://raw.githubusercontent.com/NecroSuh/AWS/refs/heads/main/logout.php
            wget https://raw.githubusercontent.com/NecroSuh/AWS/refs/heads/main/signup.html
            wget https://raw.githubusercontent.com/NecroSuh/AWS/refs/heads/main/signup.php
            systemctl restart httpd


  # Target Group
  SeoulWebTargetGroup:
    Type: "AWS::ElasticLoadBalancingV2::TargetGroup"
    Properties:
      VpcId: !Ref SeoulVPC
      Protocol: "HTTP"
      Port: 80
      TargetType: instance
      Targets:
        - Id: !Ref SeoulNATInstance
      Tags:
        - Key: "Name"
          Value: "seoul-web-tg"

  # Application Load Balancer
  SeoulWebALB:
    Type: "AWS::ElasticLoadBalancingV2::LoadBalancer"
    Properties:
      Name: "seoul-web-alb"
      Subnets:
        - !Ref SeoulPubSubnet1
        - !Ref SeoulPubSubnet2
      SecurityGroups:
        - !Ref SeoulALBSG
      Scheme: "internet-facing"
      Tags:
        - Key: "Name"
          Value: "seoul-web-alb"     

  SeoulListener:
    Type: "AWS::ElasticLoadBalancingV2::Listener"
    Properties:
      LoadBalancerArn: !Ref SeoulWebALB
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: "forward"
          TargetGroupArn: !Ref SeoulWebTargetGroup    

  # Auto Scaling Group
  SeoulWebAutoScalingGroup:
    Type: "AWS::AutoScaling::AutoScalingGroup"
    Properties:
      LaunchTemplate:
        LaunchTemplateName: "seoul-web-launch"
        Version: "1"
      VPCZoneIdentifier:
        - !Ref SeoulPriSubnet3
        - !Ref SeoulPriSubnet4
      TargetGroupARNs:
        - !Ref SeoulWebTargetGroup
      MinSize: 2
      MaxSize: 4
      DesiredCapacity: 2
      Tags:
        - Key: "Name"
          Value: "seoul-web-asg"
          PropagateAtLaunch: true

  # Security Groups
  SeoulALBSG:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "ALB Security Group"
      VpcId: !Ref SeoulVPC
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
        - IpProtocol: "tcp"
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
      Tags:
        - Key: "Name"
          Value: "seoul-alb-sg"

  SeoulNATSG:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "NAT Instance Security Group"
      VpcId: !Ref SeoulVPC
      SecurityGroupIngress:
        - IpProtocol: "-1"  # 모든 프로토콜 허용
          FromPort: 0
          ToPort: 65535
          CidrIp: 0.0.0.0/0  # 모든 IP에서 허용
      Tags:
        - Key: "Name"
          Value: "seoul-nat-sg"

  # Web Security Group
  SeoulWebSG:
    Type: "AWS::EC2::SecurityGroup"
    Properties:
      GroupDescription: "Web Security Group"
      VpcId: !Ref SeoulVPC
      SecurityGroupIngress:
        - IpProtocol: "tcp"
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref SeoulALBSG
        - IpProtocol: "tcp"
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref SeoulALBSG
        - IpProtocol: "icmp"
          FromPort: -1
          ToPort: -1
          CidrIp: "10.0.0.0/8"
        - IpProtocol: "tcp"
          FromPort: 22
          ToPort: 22
          CidrIp: "10.1.0.0/16" 
      Tags:
        - Key: "Name"
          Value: "seoul-web-sg"
